name: Build Artifact (Development Only)

# This workflow is for development testing only.
# Due to "All Rights Reserved - Do not redistribute" license,
# compiled binaries are NOT for public distribution.
# Users must build from source themselves.

on: [ workflow_dispatch ]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
          cache-cleanup: always

      - name: Gradle build
        run: ./gradlew build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: voxyvk-artifacts
          path: build/libs/*.jar
          archive: false